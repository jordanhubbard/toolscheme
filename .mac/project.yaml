schema: mac.repository_contract.v1
project: toolscheme
canonical_remote_url: git@github.com:jordanhubbard/toolscheme.git
default_branch: main
platforms:
  - darwin
  - linux
toolchain:
  required_commands:
    - c++
    - git
bootstrap:
  command: c++ -std=c++17 -O3 -Wall -Wextra -Wpedantic toolscheme.cpp test_toolscheme.cpp -o toolscheme_test
  creates:
    - toolscheme_test
test:
  command: ./toolscheme_test
evidence:
  required:
    - repo.head_sha
    - repo.pushed
    - repo.dirty
    - repo.files_changed
    - tests
